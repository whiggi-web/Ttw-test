<meta charset="utf-8">
<title>TTW Roster Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Layout: 3D stage on the left, a rig console docked right (bottom sheet on phones), event ticker over the stage */
  :root {
    --bg: #0b0d12;
    --panel: #12151d;
    --raise: #1a1e29;
    --line: #262b3a;
    --fg: #e9ecf4;
    --muted: #8b93a8;
    --teal: #19b3ac;
    --gold: #f2b632;
    --red: #e3404b;
    --display: "Anton", "Impact", "Arial Narrow", sans-serif;
    --body: "Barlow", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); overflow: hidden; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; height: 100%; }
  #view { position: relative; min-width: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  .badge { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); left: max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
  .badge h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; letter-spacing: 0.03em; text-transform: uppercase; line-height: 1; }
  .badge p { margin: 6px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
  .ticker { position: absolute; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 14px); display: flex; flex-direction: column; gap: 4px; align-items: flex-end; pointer-events: none; }
  .ev { font: 12px var(--mono); background: rgba(10, 12, 18, 0.85); border: 1px solid var(--line); border-left: 3px solid var(--gold); padding: 4px 8px; }
  .ev.hit, .ev.hit_received { border-left-color: var(--red); }
  .ev.finished { border-left-color: var(--muted); color: var(--muted); }
  .stats { position: absolute; bottom: 10px; left: max(16px, env(safe-area-inset-left, 0px)); font: 12px var(--mono); color: var(--muted); pointer-events: none; }
  .panel {
    background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; min-width: 0;
    padding-block: 16px calc(16px + env(safe-area-inset-bottom, 0px));
    padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 18px;
  }
  h2 { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  h3 { margin: 10px 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: capitalize; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button {
    font: 600 13px/1 var(--body); letter-spacing: 0.02em; color: var(--fg);
    background: var(--raise); border: 1px solid var(--line); padding: 8px 10px; cursor: pointer; border-radius: 2px;
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #041312; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  select { width: 100%; font: 600 14px var(--body); color: var(--fg); background: var(--raise); border: 1px solid var(--line); padding: 8px; }
  .axis { display: grid; grid-template-columns: 18px minmax(0, 1fr) 52px; gap: 8px; align-items: center; font: 12px var(--mono); }
  .axis b { color: var(--muted); font-weight: 500; }
  input[type=range] { width: 100%; accent-color: var(--teal); }
  output { text-align: right; font-variant-numeric: tabular-nums; }
  .time { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; margin: 8px 0 0; }
  .hint { font-size: 13px; color: var(--muted); line-height: 1.45; margin: 6px 0 0; }
  .grid2 { display: grid; gap: 8px; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
    .panel { border-left: 0; border-top: 1px solid var(--line); max-height: 48vh; padding-left: max(16px, env(safe-area-inset-left, 0px)); }
    .badge h1 { font-size: 20px; }
    .ticker { display: none; }
  }
</style>

<div class="app">
  <div id="view">
    <div class="badge"><h1>Roster Lab</h1><p>TTW batch 2 · 20 wrestlers · 58 clips</p></div>
    <div class="ticker" id="ticker" aria-live="polite"></div>
    <div class="stats" id="stats"></div>
  </div>
  <aside class="panel">
    <section>
      <h2>Wrestler</h2>
      <select id="whoSel" aria-label="Wrestler"></select>
      <div class="row" style="margin-top:8px"><button id="allBtn" aria-pressed="false">Show all 20</button></div>
    </section>
    <section>
      <h2>Animation</h2>
      <div id="anims"></div>
      <div class="row" style="margin-top:10px">
        <button id="pause">Pause</button>
        <button id="reset">Reset pose</button>
        <button id="home">Recentre</button>
      </div>
      <div class="grid2" style="margin-top:10px">
        <label class="axis"><b>T</b><input type="range" id="scrub" min="0" max="1" step="0.001" value="0" aria-label="Timeline"><output id="scrubOut">0.00</output></label>
        <label class="axis"><b>x</b><input type="range" id="speed" min="0.1" max="1.5" step="0.05" value="1" aria-label="Playback speed"><output id="speedOut">1.00</output></label>
      </div>
      <p class="time" id="time"></p>
    </section>
    <section>
      <h2>Display</h2>
      <div class="grid2">
        <label class="toggle"><input type="checkbox" id="rootMotion" checked> Apply root motion</label>
        <label class="toggle"><input type="checkbox" id="ropes"> Ropes behind wrestler</label>
        <label class="toggle"><input type="checkbox" id="showSkel"> Skeleton</label>
        <label class="toggle"><input type="checkbox" id="showAttach"> Attachment points</label>
      </div>
    </section>
    <section>
      <h2>Joint test</h2>
      <select id="bone" aria-label="Bone"></select>
      <div class="grid2" style="margin-top:10px">
        <label class="axis"><b>X</b><input type="range" id="rx" min="-180" max="180" step="1" value="0"><output id="ox">0</output></label>
        <label class="axis"><b>Y</b><input type="range" id="ry" min="-180" max="180" step="1" value="0"><output id="oy">0</output></label>
        <label class="axis"><b>Z</b><input type="range" id="rz" min="-180" max="180" step="1" value="0"><output id="oz">0</output></label>
      </div>
      <div class="row" style="margin-top:8px"><button id="zeroBone">Zero this joint</button></div>
      <p class="hint">Sliders stop the animation and pose the wrestler by hand (all 20 when showing everyone). Clips that start lying down or on the ropes jump to that pose first. Drag to orbit, scroll or pinch to zoom.</p>
    </section>
  </aside>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { loadPack, createPack } from './loader.js';
import { getStartState } from './loader-ext.js';

// ---------- scene
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
view.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0b0d12');
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 100);
camera.position.set(3.2, 2.4, -4.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.95, 0);
controls.enableDamping = true;
controls.minDistance = 0.8;
controls.maxDistance = 14;

scene.add(new THREE.HemisphereLight('#c9d6ff', '#2a2016', 1.1));
const key = new THREE.DirectionalLight('#fff3e4', 2.4);
key.position.set(2.5, 5, -3);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 });
key.shadow.mapSize.set(2048, 2048);
scene.add(key, key.target);
const rim = new THREE.DirectionalLight('#5fd6ff', 1.1);
rim.position.set(-3, 2.5, 3);
scene.add(rim);

const mat = new THREE.Mesh(new THREE.BoxGeometry(16, 0.1, 16), new THREE.MeshStandardMaterial({ color: '#dfe3ea', roughness: 0.95 }));
mat.position.y = -0.05;
mat.receiveShadow = true;
scene.add(mat);
const grid = new THREE.GridHelper(16, 32, '#8a93a8', '#c3c8d3');
grid.position.y = 0.002;
scene.add(grid);

// Ropes for the rope animations: behind the wrestler (+Z), heights match the TTW ring
const ropeGroup = new THREE.Group();
const ropeMat = new THREE.MeshStandardMaterial({ color: '#c4161c', roughness: 0.6 });
for (const h of [0.45, 0.85, 1.25]) {
  const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 4, 8), ropeMat);
  rope.rotation.z = Math.PI / 2;
  rope.position.set(0, h, 0.42);
  rope.castShadow = true;
  ropeGroup.add(rope);
}
for (const x of [-2, 2]) {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 1.5, 10), new THREE.MeshStandardMaterial({ color: '#a3acb6', metalness: 0.8, roughness: 0.35 }));
  post.position.set(x, 0.75, 0.42);
  ropeGroup.add(post);
}
ropeGroup.visible = false;
scene.add(ropeGroup);

// ---------- pack
const pack = window.TTW_PACK ? createPack(window.TTW_PACK) : await loadPack('./manifest-batch2.json');
const ids = pack.wrestlerIds;
const wrestlers = ids.map((id) => {
  const w = pack.createWrestler(id, { autoRootMotion: true });
  scene.add(w.object);
  return w;
});
const COLS = 5, GAP = 1.7;
const slot = (i, n) => n === 1 ? [0, 0] : [((i % COLS) - (COLS - 1) / 2) * GAP, (Math.floor(i / COLS) - (Math.ceil(n / COLS) - 1) / 2) * GAP * 1.4];

let mode = ids[0];
let currentAnim = 'movement.idle';
const active = () => (mode === 'all' ? wrestlers : wrestlers.filter((w) => w.id === mode));

// overlays
const overlays = wrestlers.map((w) => {
  const skel = new THREE.SkeletonHelper(w.object);
  skel.material.depthTest = false;
  skel.visible = false;
  scene.add(skel);
  const dots = Object.values(w.bones).map((b) => {
    const d = new THREE.Mesh(new THREE.SphereGeometry(0.018, 8, 6), new THREE.MeshBasicMaterial({ color: '#19b3ac', depthTest: false }));
    d.renderOrder = 10; d.visible = false; b.add(d); return d;
  });
  const marks = Object.values(w.attachments).flatMap((a) => {
    const ax = new THREE.AxesHelper(0.08); ax.material.depthTest = false; ax.renderOrder = 11; ax.visible = false;
    const s = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 6), new THREE.MeshBasicMaterial({ color: '#f2b632', depthTest: false }));
    s.renderOrder = 11; s.visible = false;
    a.add(ax, s); return [ax, s];
  });
  return { skel, dots, marks };
});

function home() {
  const list = active();
  wrestlers.forEach((w) => { w.object.visible = list.includes(w); });
  list.forEach((w, i) => { const [x, z] = slot(i, list.length); w.object.position.set(x, 0, z); w.object.rotation.set(0, 0, 0); });
  ropeGroup.visible = ropeGroup.visible && list.length === 1;
  applyOverlays();
}

// ---------- wrestler selector
const whoSel = document.getElementById('whoSel');
const allBtn = document.getElementById('allBtn');
for (const w of wrestlers) {
  const o = document.createElement('option');
  o.value = w.id; o.textContent = `${w.id.slice(-2)}  ${w.def.displayName}`;
  whoSel.appendChild(o);
}
function setMode(m) {
  mode = m;
  allBtn.setAttribute('aria-pressed', String(m === 'all'));
  if (m !== 'all') whoSel.value = m;
  if (m === 'all') { camera.position.set(9, 9, -13); controls.target.set(0, 0.8, 0); }
  else { camera.position.set(3.2, 2.4, -4.2); controls.target.set(0, 0.95, 0); }
  home(); playAnim(currentAnim); updateStats(); syncSliders();
}
whoSel.onchange = () => setMode(whoSel.value);
allBtn.onclick = () => setMode(mode === 'all' ? whoSel.value : 'all');

// ---------- animation buttons
const animBox = document.getElementById('anims');
const animButtons = {};
for (const [cat, list] of Object.entries(pack.animations.byCategory())) {
  const h = document.createElement('h3'); h.textContent = cat; animBox.appendChild(h);
  const row = document.createElement('div'); row.className = 'row'; animBox.appendChild(row);
  for (const id of list) {
    const b = document.createElement('button');
    b.id = 'anim-' + id.replace('.', '-');
    b.textContent = pack.animations.defs[id].name.replace(/^Hit reaction, /, 'Hit ').replace(/^Hit from /, 'Hit ');
    if (pack.animations.defs[id].batch === 2) b.title = 'Batch 2';
    b.setAttribute('aria-pressed', 'false');
    b.onclick = () => playAnim(id);
    row.appendChild(b); animButtons[id] = b;
  }
}
const pauseBtn = document.getElementById('pause');
const speed = document.getElementById('speed');
const scrub = document.getElementById('scrub');
const rootMotionBox = document.getElementById('rootMotion');
const ropesBox = document.getElementById('ropes');

function markPlaying(id) { for (const [k, b] of Object.entries(animButtons)) b.setAttribute('aria-pressed', String(k === id)); }

// Clips that start from a pose other than standing get a lead-in: jump to the end of a clip that ends in that pose
const LEAD_IN = { 'lying-back': 'falls.fall-backward', 'lying-front': 'falls.fall-forward', 'rope-lean': 'ropes.rope-lean', 'kneeling': 'falls.collapse-knees' };
const STARTS_FROM = Object.fromEntries(Object.values(pack.animations.defs)
  .map((d) => [d.id, LEAD_IN[getStartState(d)]]).filter(([, lead]) => lead));

function playAnim(id) {
  currentAnim = id;
  const def = pack.animations.defs[id];
  if (def.category === 'ropes' && mode !== 'all') { ropesBox.checked = true; ropeGroup.visible = true; }
  const list = active();
  // Recentre for one-shot clips unless we are continuing a chain from its proper start
  const continuing = STARTS_FROM[id] && list.every((w) => w.current === STARTS_FROM[id]);
  if (!continuing && !def.loop) home();
  for (const w of list) {
    if (!continuing && STARTS_FROM[id]) {
      // jump straight to the end of the clip this one starts from, then play
      w.play(STARTS_FROM[id], { fade: 0 });
      const a = w.actions[STARTS_FROM[id]];
      a.time = a.getClip().duration; w.mixer.update(0);
      w.commitRootMotion(); w.bones.hips.position.x = w.restPositions.hips.x; w.bones.hips.position.z = w.restPositions.hips.z;
    }
    w.play(id, { fade: def.loop ? 0.25 : 0.12, timeScale: Number(speed.value) });
  }
  markPlaying(id);
  pauseBtn.textContent = 'Pause';
  scrub.max = def.duration;
}

pauseBtn.onclick = () => {
  const list = active();
  if (!list[0].current) return;
  const p = !list[0].paused;
  list.forEach((w) => w.setPaused(p));
  pauseBtn.textContent = p ? 'Resume' : 'Pause';
};
document.getElementById('reset').onclick = () => { active().forEach((w) => w.resetPose()); markPlaying(null); home(); syncSliders(); };
document.getElementById('home').onclick = () => home();
speed.oninput = () => {
  document.getElementById('speedOut').textContent = Number(speed.value).toFixed(2);
  active().forEach((w) => w.current && w.actions[w.current].setEffectiveTimeScale(Number(speed.value)));
};
scrub.oninput = () => {
  const t = Number(scrub.value);
  active().forEach((w) => {
    if (!w.current) return;
    w.setPaused(true);
    const a = w.actions[w.current];
    a.paused = false; a.enabled = true; a.time = t; w.mixer.update(0);
  });
  pauseBtn.textContent = 'Resume';
};
rootMotionBox.onchange = () => wrestlers.forEach((w) => { w.autoRootMotion = rootMotionBox.checked; });
ropesBox.onchange = () => { ropeGroup.visible = ropesBox.checked; };

function applyOverlays() {
  const sk = document.getElementById('showSkel').checked;
  const at = document.getElementById('showAttach').checked;
  wrestlers.forEach((w, i) => {
    const on = w.object.visible;
    overlays[i].skel.visible = sk && on;
    overlays[i].dots.forEach((d) => (d.visible = sk && on));
    overlays[i].marks.forEach((m) => (m.visible = at && on));
  });
}
document.getElementById('showSkel').onchange = applyOverlays;
document.getElementById('showAttach').onchange = applyOverlays;

// ---------- event ticker
const ticker = document.getElementById('ticker');
const pushEvent = (e) => {
  const d = document.createElement('div');
  d.className = 'ev ' + e.name;
  const who = e.wrestler.def.displayName.split(' ')[0];
  d.textContent = `${who}  ${e.name}${e.time !== undefined ? '  @' + e.time.toFixed(2) + 's' : ''}`;
  ticker.prepend(d);
  while (ticker.children.length > 7) ticker.lastChild.remove();
};
wrestlers.forEach((w) => w.on('*', pushEvent));

// ---------- joint test
const boneSel = document.getElementById('bone');
for (const b of pack.skeletonDef.bones) {
  const o = document.createElement('option'); o.value = b.name; o.textContent = b.name; boneSel.appendChild(o);
}
boneSel.value = 'rightUpperArm';
const axes = ['x', 'y', 'z'].map((k) => ({ k, input: document.getElementById('r' + k), out: document.getElementById('o' + k) }));
function syncSliders() {
  const name = boneSel.value;
  const lim = (pack.skeletonDef.jointLimits || {})[name] || {};
  const rot = active()[0].getJointRotation(name);
  axes.forEach((a, i) => {
    const [mn, mx] = lim[a.k] || [-180, 180];
    a.input.min = mn; a.input.max = mx;
    a.input.value = Math.round(rot[i]); a.out.textContent = Math.round(rot[i]);
  });
}
function applySliders() {
  const v = axes.map((a) => Number(a.input.value));
  axes.forEach((a, i) => (a.out.textContent = v[i]));
  for (const w of active()) {
    if (w.current) { w.stop(); markPlaying(null); }
    w.setJointRotation(boneSel.value, ...v);
  }
}
axes.forEach((a) => a.input.addEventListener('input', applySliders));
boneSel.onchange = syncSliders;
document.getElementById('zeroBone').onclick = () => { axes.forEach((a) => (a.input.value = 0)); applySliders(); };

// ---------- stats + loop
function updateStats() {
  const list = active();
  const tris = list.reduce((s, w) => s + w.mesh.geometry.index.count / 3, 0);
  document.getElementById('stats').textContent =
    `${list.length} wrestler${list.length > 1 ? 's' : ''} · ${tris} tris · ${list.length} draw call${list.length > 1 ? 's' : ''} · ${pack.skeletonDef.bones.length} bones · ${Object.keys(pack.animations.defs).length} clips`;
}

function resize() {
  const r = view.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(1, r.height);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);
resize();

const timeEl = document.getElementById('time');
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  for (const w of active()) {
    w.update(dt);
    // keep looping locomotion on the mat
    if (mode !== 'all' && (Math.abs(w.object.position.z) > 3.6 || Math.abs(w.object.position.x) > 3.6)) home();
    if (mode === 'all' && w.current && pack.animations.defs[w.current].loop && Math.abs(w.object.position.z) > 6) home();
  }
  const lead = active()[0];
  if (lead.current) {
    const a = lead.actions[lead.current];
    const d = a.getClip().duration;
    timeEl.textContent = `${lead.current}  ${a.time.toFixed(2)} / ${d.toFixed(2)} s   speed ${lead.getRootSpeed().toFixed(1)} m/s`;
    if (!lead.paused) { scrub.value = a.time; }
    document.getElementById('scrubOut').textContent = a.time.toFixed(2);
  } else timeEl.textContent = 'Manual pose';
  controls.update();
  renderer.render(scene, camera);
  if (!window.__paused) requestAnimationFrame(tick);
}

home();
updateStats();
syncSliders();
playAnim('movement.idle');
tick();

// hooks for automated renders
window.__lab = { pack, wrestlers, camera, controls, renderer, scene, home, playAnim, ropeGroup,
  render(pos, target) { if (pos) camera.position.set(...pos); if (target) controls.target.set(...target); controls.update(); renderer.render(scene, camera); },
  setMode };
window.__ready = true;
</script>
